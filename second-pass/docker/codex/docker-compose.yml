# Host launchers provide four distinct roots: a writable stage workspace,
# immutable invocation evidence, persistent per-task Codex state, and a
# read-only launcher-owned prompt. The Codex sandbox grants model commands
# write access only to /workspace.
services:
  runner:
    build:
      context: ../..
      dockerfile: docker/codex/Dockerfile
    image: humaneval-codex-runner
    init: true
    mem_limit: ${MEMORY_LIMIT:-8g}
    memswap_limit: ${MEMORY_LIMIT:-8g}
    # Codex's workspace-write sandbox uses its bundled bubblewrap binary.
    # Docker's default seccomp profile blocks the unprivileged user namespace
    # it requires. No capability (in particular SYS_ADMIN) is added here.
    security_opt:
      - seccomp=unconfined
    environment:
      MODEL: ${MODEL:-gpt-5.6-sol}
      EFFORT: ${EFFORT:-xhigh}
      TIMEOUT_S: ${TIMEOUT_S:-3600}
      KIT: ${KIT:-0}
      INVOCATION_KIND: ${INVOCATION_KIND:-initial}
      SESSION_ID: ${SESSION_ID:-}
      WORKSPACE: /workspace
      INVOCATION_OUTPUT: /invocation-output
      CODEX_HOME: /codex-home
      PROMPT_FILE: /invocation-prompt.md
      CODEX_AUTH_FILE: /auth/auth.json
      KIT_SKILLS_DIR: /kit-skills
    volumes:
      - ${WORKSPACE_DIR:-/tmp}:/workspace:rw
      - ${INVOCATION_DIR:-/tmp}:/invocation-output:rw
      - ${CODEX_HOME_DIR:-/tmp}:/codex-home:rw
      - ${PROMPT_PATH:-../../prompts/bare.md}:/invocation-prompt.md:ro
      - ./secrets/codex/auth.json:/auth/auth.json:ro
    working_dir: /workspace
