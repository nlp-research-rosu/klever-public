# Per-task usage (from this docker/claude-code/ directory):
#
#   TASK_DIR=/abs/path/to/humaneval-benchmark/runs/<config>/<problem> \
#   MODEL=opus EFFORT=xhigh \
#   docker compose run --rm -T runner "$(cat ../../prompts/bare.md)"
#
# Prefer the wrappers ./run_task.sh and ./run_matrix.sh, which pick the model
# and prompt from the config name.
#
# The container sees ONLY $TASK_DIR (mounted as /work, rw), is capped at 8 GB
# of memory, and the entrypoint enforces a wall-clock timeout (TIMEOUT_S,
# default 3600 s) and writes metrics.json into the task folder.
#
# Auth (pick ONE):
#   A) Subscription / OAuth (default): seed the token once —
#        mkdir -p secrets/claude && cp ~/.claude/.credentials.json secrets/claude/
#      It is mounted read-only; each container copies it into its own ephemeral
#      config (parallel-safe, nothing written back).
#   B) API key: put ANTHROPIC_API_KEY in docker/claude-code/.env and comment out
#      the ./secrets/claude/.credentials.json volume below.
services:
  runner:
    build: .
    image: humaneval-claude-runner
    init: true
    mem_limit: 8g
    memswap_limit: 8g
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL: ${MODEL:-opus}
      EFFORT: ${EFFORT:-xhigh}
      OUTPUT_FORMAT: ${OUTPUT_FORMAT:-json}
      PERMISSION_MODE: ${PERMISSION_MODE:-bypassPermissions}
      TIMEOUT_S: ${TIMEOUT_S:-3600}
      KIT: ${KIT:-0}
    volumes:
      # The one folder the agent is confined to.
      - ${TASK_DIR:?set TASK_DIR to an absolute path of a runs/<config>/<problem> folder}:/work:rw
      # Auth option A: mount ONLY the OAuth token, read-only. Comment out if
      # using ANTHROPIC_API_KEY (option B).
      - ./secrets/claude/.credentials.json:/auth/.credentials.json:ro
    working_dir: /work
