# Per-task usage (from this docker/opencode/ directory):
#
#   TASK_DIR=/abs/path/to/humaneval-benchmark/runs/<config>/<problem> \
#   docker compose run --rm -T runner "$(cat ../../prompts/bare.md)"
#
# Prefer the wrappers ./run_task.sh and ./run_matrix.sh, which pick the model
# and prompt from the config name.
#
# Auth: secrets/api_key.json = {"OPENROUTER_API_KEY": "sk-or-..."} (gitignored),
# mounted read-only; the entrypoint exports it for OpenCode's openrouter
# provider.
services:
  runner:
    build: .
    image: humaneval-opencode-runner
    init: true
    mem_limit: 8g
    memswap_limit: 8g
    environment:
      MODEL: ${MODEL:-openrouter/moonshotai/kimi-k3}
      TIMEOUT_S: ${TIMEOUT_S:-3600}
    volumes:
      # The one folder the agent is confined to.
      - ${TASK_DIR:?set TASK_DIR to an absolute path of a runs/<config>/<problem> folder}:/work:rw
      # OpenRouter API key, read-only.
      - ./secrets/api_key.json:/auth/api_key.json:ro
    working_dir: /work
